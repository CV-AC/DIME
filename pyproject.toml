[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dime-face"
version = "0.1.0"
description = "Identity-paired masked pretraining for facial representation learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "numpy>=1.24",
    "Pillow>=9.5",
    "lmdb>=1.4",
    "PyYAML>=6.0",
    "timm>=1.0.20",
    "scipy>=1.10",
    "pandas>=2.0",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "tqdm>=4.65",
    "einops>=0.6",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
tracking = ["wandb>=0.16"]

[tool.setuptools.packages.find]
where = [".", "DIME_face_low_level/facebench"]
include = ["DIME_VIT*", "facebench*"]
exclude = ["*tests*", "*third_party*"]

[tool.setuptools.package-data]
DIME_VIT = ["configs/*.yaml"]
facebench = ["tasks/*/configs/*.yaml", "tasks/*/configs/*/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["DIME_VIT/tests", "DIME_face_low_level/facebench/tests"]
pythonpath = [".", "DIME_face_low_level/facebench"]
